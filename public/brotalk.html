<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bro Talk - Bro OS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .chat-header {
      padding: 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header h2 {
      font-size: 1.2rem;
      color: #38bdf8;
    }
    .user-info {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      background: #334155;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .message.mine {
      align-self: flex-end;
      background: #0284c7;
    }
    .message .username {
      font-weight: bold;
      font-size: 0.75rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .message.mine .username {
      color: #e0f2fe;
    }
    .message .time {
      font-size: 0.65rem;
      color: #94a3b8;
      text-align: right;
      margin-top: 4px;
    }
    .chat-input {
      padding: 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
      border-radius: 0 0 12px 12px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      outline: none;
    }
    .chat-input input:focus {
      border-color: #38bdf8;
    }
    .chat-input button {
      padding: 10px 20px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-input button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>💬 Bro Talk</h2>
      <div class="user-info" id="userInfo">Usuario: Conectando...</div>
    </div>

    <div class="chat-messages" id="messagesContainer"></div>

    <form class="chat-input" id="chatForm">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" required />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    // Obtener el usuario guardado tras el Login (o asignar 'Anónimo')
    const currentUsername = localStorage.getItem('bro_username') || 'BroUser_' + Math.floor(Math.random() * 1000);
    document.getElementById('userInfo').textContent = `Usuario: ${currentUsername}`;

    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const messagesContainer = document.getElementById('messagesContainer');

    // Enviar mensaje al servidor
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = messageInput.value.trim();
      if (msg) {
        socket.emit('send_message', {
          username: currentUsername,
          message: msg
        });
        messageInput.value = '';
      }
    });

    // Recibir mensajes en vivo desde el servidor
    socket.on('receive_message', (data) => {
      const isMine = data.username === currentUsername;
      const msgElement = document.createElement('div');
      msgElement.classList.add('message');
      if (isMine) msgElement.classList.add('mine');

      msgElement.innerHTML = `
        <div class="username">${data.username}</div>
        <div class="text">${data.message}</div>
        <div class="time">${data.timestamp}</div>
      `;

      messagesContainer.appendChild(msgElement);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
  </script>
</body>
</html>
